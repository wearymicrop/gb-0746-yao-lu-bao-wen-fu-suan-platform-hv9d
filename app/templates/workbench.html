<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{ name }}</title><link rel="stylesheet" href="/static/console.css"><link rel="stylesheet" href="/static/print.css" media="print"><script src="/static/console.js" type="module"></script></head>
<body><div class="frame">
<aside class="rail"><a class="brand" href="/" aria-label="窑炉保温复算台首页"><i></i><span>窑炉 <b>/</b> 保温复算</span></a><nav aria-label="窑炉查验"><a href="#track">保温计时</a><a href="#finding">断档复判</a><a href="#inputs">炉单证据</a><a href="#sign">签核归档</a></nav><div class="rail-foot"><b>●</b> 工艺复核工位</div></aside>
<div class="work"><header class="topbar"><div><span class="context">工艺记录 / 热区</span><h1>{{ name }}</h1></div><div class="tools"><label for="sample">来源</label><select id="sample">{% for key, label in samples.items() %}<option value="{{ key }}" {% if key == 'dirty' %}selected{% endif %}>{{ label }}</option>{% endfor %}</select><label class="upload">导入炉单<input type="file" id="upload" accept=".json,application/json"></label></div></header>
<main><div class="runline"><strong id="batch">读取炉单</strong><span id="reading-status" role="status"></span></div><div class="kpis" id="metrics"></div>
<div class="grid"><section class="panel track" id="track"><div class="panel__head"><h2>保温轨道</h2><span>上海时间</span></div><div class="legend"><span class="proven">达标</span><span class="cold">失温</span><span class="unproven">缺证</span></div><div id="track-bars" aria-label="选择时间段"></div><div id="track-axis"></div><div id="segment" class="segment" aria-live="polite"></div></section>
<section class="panel findings" id="finding"><div class="panel__head"><h2>断档复判</h2><span id="gap-count"></span></div><div id="gap-list"></div></section>
<section class="panel" id="inputs"><div class="panel__head"><h2>炉单证据</h2><label>查看 <select id="evidence"><option value="intake">炉单采集</option><option value="calibration">热电偶校正</option><option value="alignment">热区对齐</option></select></label></div><div class="ledger" id="evidence-table"></div></section>
<section class="panel archive" id="sign"><div class="panel__head"><h2>签核归档</h2></div><div class="sign-body"><div id="balance"></div><form id="sign-form"><label>签核人 <input id="operator" maxlength="32" required placeholder="输入签核人"></label><button type="submit">归档炉批</button></form><div class="run-actions" id="run-actions" hidden><button type="button" id="rerun">重跑归档</button><a id="export">导出证据</a></div><div id="run-feedback" role="status"></div></div></section></div></main>
<footer class="statusbar"><span>规则 {{ version }} · 东八区</span><a href="/docs">接口</a></footer></div></div></body></html>
