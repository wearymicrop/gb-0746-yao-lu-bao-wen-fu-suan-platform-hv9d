services:
  app:
    build: .
    ports:
      - "${APP_PORT:-18440}:8000"
    environment:
      APP_DB: /state/ledger.sqlite3
      TZ: Asia/Shanghai
    volumes:
      - state:/state
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2).close()"]
      interval: 5s
      timeout: 3s
      retries: 8
volumes:
  state:
